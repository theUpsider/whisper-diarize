[project]
name = "whisper-transcriber"
version = "0.2.0"
description = "Transcribe and diarize video/audio files with WhisperX, plus live recording GUI"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv",
    "pynput>=1.7",
    "torch",
    "whisperx",
]

[project.scripts]
whisper-recorder = "recorder.main:main"
whisper-transcribe = "main:main"

[tool.uv]
package = true

[tool.setuptools]
py-modules = ["main"]
packages = ["recorder"]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
